# Mightyfin ERP — HRM module production stack
# Follows the host conventions:
#   - Everything runs as a Docker Compose stack in /home/mightyfin/production/hrm,
#     image tag :local, built from the cloned repo (deployment/hrm/Dockerfile).
#   - Secrets/env live under /home/mightyfin/.config/mightyfin/hrm/.env.
#   - Only 127.0.0.1 ports are bound on the host (127.0.0.1:28912).
#   - Public exposure is done by the shared Traefik ingress (traefik-traefik-1),
#     exactly like efaas-origin / auth.mightyfinance.co.zm: Host rule on the
#     websecure entrypoint with the letsencrypt certresolver.
#   - erp_default is joined so erp-postgres-1 (the ERP database) resolves by DNS.

services:
  hrn-api:
    build:
      context: ../..
      dockerfile: deployment/hrm/Dockerfile
    image: mightyfin/hrm-api:local
    container_name: hrm-api-1
    restart: unless-stopped
    env_file:
      - /home/mightyfin/.config/mightyfin/hrm/.env
    ports:
      - "127.0.0.1:28911:8080"
    networks:
      - erp_default
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/live >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: deployment/hrm/Dockerfile
    image: mightyfin/hrm-api:local
    container_name: hrm-migrate-1
    entrypoint: ["dotnet", "Mightyfin.Erp.Hrm.Api.dll", "--apply-migrations-only"]
    env_file:
      - /home/mightyfin/.config/mightyfin/hrm/.env
    networks:
      - erp_default
    restart: "no"

  hrn-web:
    build:
      context: ../..
      dockerfile: deployment/hrm/web.Dockerfile
    image: mightyfin/hrm-web:local
    container_name: hrm-web-1
    restart: unless-stopped
    environment:
      PORT: "3000"
    networks:
      - erp_default
    depends_on:
      - hrn-api
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  hrm-proxy:
    image: nginx:alpine
    container_name: hrm-proxy-1
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:28912:80"
    depends_on:
      - hrn-web
    networks:
      - erp_default
    labels:
      traefik.enable: "true"
      traefik.http.routers.hrm.rule: "Host(`hrm.mightyfinance.co.zm`)"
      traefik.http.routers.hrm.entrypoints: "websecure"
      traefik.http.routers.hrm.tls: "true"
      traefik.http.routers.hrm.tls.certresolver: "letsencrypt"
      traefik.http.services.hrm.loadbalancer.server.port: "80"

networks:
  erp_default:
    external: true
