# Mightyfin ERP — HRM module production stack
# Runs behind the shared Cloudflare Tunnel (hrm.mightyfin.com -> localhost:28912).
# The web service joins erp_default so it can resolve erp-postgres-1 via DNS,
# and it serves the static React build + proxies /api/hrm -> hrn-api:8080.
# The API itself joins erp_default so its own connections to erp-postgres-1
# also resolve; nothing binds to a public interface except 127.0.0.1 ports.

services:
  hrn-api:
    build:
      context: ../..
      dockerfile: deployment/hrm/Dockerfile
    image: mightyfin/hrm-api:local
    container_name: hrm-api-1
    restart: unless-stopped
    env_file:
      - /home/mightyfin/.config/mightyfin/hrm/.env
    networks:
      - erp_default
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: deployment/hrm/Dockerfile
    image: mightyfin/hrm-api:local
    container_name: hrm-migrate-1
    entrypoint: ["dotnet", "Mightyfin.Erp.Hrm.Api.dll", "--apply-migrations-only"]
    env_file:
      - /home/mightyfin/.config/mightyfin/hrm/.env
    networks:
      - erp_default
    depends_on:
      - hrn-db-ready

  hrn-web:
    image: nginx:alpine
    container_name: hrm-web-1
    restart: unless-stopped
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:28912:80"
    depends_on:
      - hrn-api
    networks:
      - erp_default

networks:
  erp_default:
    external: true
