server {
    listen 80;
    server_name _;
    server_tokens off;

    # Docker replaces container IP addresses on deployment. Resolve service names
    # at request time so nginx never keeps proxying to a retired container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $hrm_api_upstream hrn-api:8080;
    set $hrm_web_upstream hrn-web:3000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API surface — proxy everything under /api/hrm to the .NET API.
    # The React client is built with VITE_HRM_API_BASE=/api/hrm, so all
    # requests naturally flow through here to hrn-api:8080.
    location /api/hrm/ {
        proxy_pass http://$hrm_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health passthrough, mirroring the convention used by the ERP API surface.
    location /health/ {
        proxy_pass http://$hrm_api_upstream;
    }

    # HRM SPA — mounted at /hrm under the ERP domain (erp.mightyfinance.co.zm/hrm).
    # The Cloudflare Tunnel routes /hrm on the ERP hostname to this proxy
    # (127.0.0.1:28912). Everything not under /hrm is left untouched so the ERP
    # domain's default backend (the Go ERP API on :28910) keeps answering root
    # paths. The SPA's routes already carry the /hrm prefix, so the request
    # path is forwarded as-is.
    location /hrm {
        proxy_pass http://hrn-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Authentication callbacks and the module selector are application routes
    # outside /hrm (for example /sign-in). This proxy is exposed only on the
    # dedicated HRM hostname, so all remaining frontend paths safely fall back
    # to the TanStack server.
    location / {
        proxy_pass http://$hrm_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
