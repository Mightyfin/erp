server {
    listen 80;
    server_name _;

    # API surface — proxy everything under /api/hrm to the .NET API.
    # The React client is built with VITE_HRM_API_BASE=/api/hrm, so all
    # requests naturally flow through here to hrn-api:8080.
    location /api/hrm/ {
        proxy_pass http://hrn-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health passthrough, mirroring the convention used by the ERP API surface.
    location /health/ {
        proxy_pass http://hrn-api:8080;
    }

    # Everything else goes to the Node SSR frontend (TanStack Start).
    location / {
        proxy_pass http://hrn-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
