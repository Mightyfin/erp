server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API surface — proxy everything under /api/hrm to the .NET API.
    # The React client is built with VITE_HRM_API_BASE=/api/hrm, so all
    # requests naturally flow through here to hrn-api:8080.
    location /api/hrm/ {
        proxy_pass http://hrn-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Health passthrough (used by docker healthcheck on the api container;
    # kept here in case the tunnel ever probes the web port).
    location /health/ {
        proxy_pass http://hrn-api:8080;
    }

    # React SPA: try real files, fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Cache-busted SPA assets get a long cache; index.html itself is never cached.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the SPA entrypoint.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
